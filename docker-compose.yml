services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: india_events
    volumes: [mysqldata:/var/lib/mysql]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"], interval: 5s, retries: 20 }
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: mysql+pymysql://root:rootpass@db:3306/india_events
      SECRET_KEY: change-this-to-a-long-random-string
      CORS_ORIGINS: "*"
    depends_on: { db: { condition: service_healthy } }
volumes: { mysqldata: {} }
